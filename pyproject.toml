[project]
name = "ravan-ai-companion"
version = "0.1.0"
description = "Ravan gut-microbiome AI companion — LangGraph + Streamlit prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2.50",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.5",
]

# Treat this as an application, not an installable library, so `uv sync` just
# builds the .venv with the dependencies above and leaves the local
# `ravan_companion/` package importable from the project root.
[tool.uv]
package = false
